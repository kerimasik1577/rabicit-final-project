<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RabiCit — Altındağ 1 km Konum & Yürüyüş Radarı</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet Harita CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    h1, h2, h3, .font-display {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    /* Harita katmanlarının üst üste binmesini önlemek için */
    #map {
      z-index: 1;
    }
    /* Nabız (Pulse) animasyonlu canlı konum ikonu */
    .pulse-marker {
      position: relative;
      width: 20px;
      height: 20px;
    }
    .pulse-dot {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background-color: #2563eb;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.7);
      z-index: 2;
    }
    .pulse-ring {
      position: absolute;
      top: -6px;
      left: -6px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: rgba(37, 99, 235, 0.35);
      animation: radarPulse 2s infinite ease-out;
      z-index: 1;
    }
    @keyframes radarPulse {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(1.8); opacity: 0; }
    }
    /* Özel kaydırma çubuğu */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    /* Mobil cihaz çerçevesi (Masaüstünde Figma yakalaması için 393x852 iPhone ölçüsü) */
    @media (min-width: 640px) {
      .mobile-shell {
        width: 393px;
        height: 852px;
        border-radius: 44px;
        border: 10px solid #0f172a;
        box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.35);
      }
    }
  </style>
</head>
<body class="bg-slate-200 text-slate-900 min-h-screen flex items-center justify-center sm:py-6">

  <!-- FİGMA UYUMLU MOBİL UYGULAMA ÇERÇEVESİ (393x852) -->
  <div id="figma-mobile-frame" class="mobile-shell w-full h-screen bg-white relative overflow-hidden flex flex-col">

    <!-- iOS DURUM ÇUBUĞU (Figma Tasarımı İçin) -->
    <div class="bg-white/95 backdrop-blur-md px-6 pt-2.5 pb-1 flex items-center justify-between text-[11px] font-bold text-slate-900 z-40 shrink-0">
      <span>09:41</span>
      <div class="w-24 h-5 bg-slate-950 rounded-full"></div>
      <div class="flex items-center gap-1.5">
        <span>5G</span>
        <span class="w-5 h-2.5 border border-slate-900 rounded-[3px] p-[1px] inline-flex items-center">
          <span class="w-full h-full bg-slate-900 rounded-[1px]"></span>
        </span>
      </div>
    </div>

    <!-- MOBİL ÜST BAŞLIK & KONTROL BARI -->
    <header class="bg-white/95 backdrop-blur-md border-b border-slate-100 px-4 py-2.5 flex items-center justify-between gap-2 z-30 shrink-0">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 text-white flex items-center justify-center font-display font-extrabold text-base shadow-sm">
          R
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-sm font-extrabold text-slate-900 leading-none">RabiCit</h1>
            <span class="px-1.5 py-0.5 text-[10px] font-bold bg-blue-50 text-blue-700 rounded-md">Altındağ</span>
          </div>
          <p class="text-[11px] text-slate-500 mt-0.5">1 km Tarih & Kalabalık Radarı</p>
        </div>
      </div>

      <button id="btn-gps" onclick="startRealGPS()" class="px-2.5 py-1.5 rounded-xl text-[11px] font-semibold bg-slate-100 hover:bg-slate-200 text-slate-800 transition flex items-center gap-1 cursor-pointer">
        <span>📍</span>
        <span>GPS</span>
      </button>
    </header>

    <!-- TAM EKRAN ALTINDAĞ HARİTA ALANI -->
    <div class="relative flex-1 w-full overflow-hidden">
      
      <!-- ÜST YÜZEN KONUM & ROTA KARTI -->
      <div class="absolute top-2.5 left-3 right-3 z-[500] pointer-events-none flex flex-col gap-1.5">
        <div class="bg-white/95 backdrop-blur-md border border-slate-200/80 rounded-2xl px-3 py-2 shadow-sm pointer-events-auto flex items-center justify-between gap-2">
          <div class="flex items-center gap-2 min-w-0">
            <span id="status-dot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse shrink-0"></span>
            <div class="truncate">
              <div id="status-title" class="text-[11px] font-bold text-slate-800 truncate">Ulus Meydanı (Başlangıç)</div>
              <div id="status-coords" class="text-[10px] text-slate-500">39.94250, 32.85420 • Çap: 1.0 km</div>
            </div>
          </div>
          <button id="btn-sim" onclick="toggleWalkSimulation()" class="px-2.5 py-1.5 rounded-xl text-[11px] font-bold bg-blue-600 hover:bg-blue-700 text-white transition flex items-center gap-1 shrink-0 shadow-sm cursor-pointer">
            <span id="sim-icon">🚶</span>
            <span id="sim-text">Yürüyüşü Başlat</span>
          </button>
        </div>

        <!-- Simülasyon Adım Rozeti -->
        <div id="sim-progress-card" class="hidden self-start bg-slate-900/90 text-white backdrop-blur-md rounded-xl px-3 py-1.5 shadow-sm pointer-events-auto text-[10px] flex items-center gap-1.5">
          <span class="text-blue-400 font-bold">Rota:</span>
          <span id="sim-step-label">Ulus → Hacı Bayram</span>
        </div>
      </div>

      <!-- HARİTA CONTAINER -->
      <div id="map" class="w-full h-full"></div>
    </div>

    <!-- ALT ÇEKMECE PANELİ (BOTTOM SHEET - FİGMA KART DÜZENİ) -->
    <section class="bg-white rounded-t-3xl shadow-[0_-8px_25px_rgba(15,23,42,0.08)] border-t border-slate-200/80 z-30 flex flex-col h-[46%] shrink-0">
      
      <!-- Çekmece Tutamacı (Handle) -->
      <div class="w-full pt-2 pb-1 flex justify-center">
        <div class="w-10 h-1 rounded-full bg-slate-300"></div>
      </div>

      <!-- BAŞLIK & FİLTRE CHİPLERİ -->
      <div class="px-4 pb-2.5 border-b border-slate-100">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-xs font-extrabold text-slate-900 uppercase tracking-wide">1 km Yakındaki Mekanlar</h2>
          <span id="nearby-count" class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-blue-600 text-white">0</span>
        </div>
        <div class="flex gap-1.5 overflow-x-auto pb-0.5">
          <button onclick="setFilter('all', this)" class="filter-btn active px-3 py-1 rounded-full text-[11px] font-semibold bg-blue-600 text-white transition cursor-pointer shrink-0">
            Tümü
          </button>
          <button onclick="setFilter('calm', this)" class="filter-btn px-3 py-1 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition cursor-pointer shrink-0">
            Sadece Sakin
          </button>
          <button onclick="setFilter('museum', this)" class="filter-btn px-3 py-1 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition cursor-pointer shrink-0">
            Müzeler
          </button>
        </div>
      </div>

      <!-- KAYDIRILABİLİR MEKAN KARTLARI -->
      <div id="places-list" class="flex-1 overflow-y-auto px-4 py-2.5 space-y-2.5">
        <!-- JS ile doldurulacak -->
      </div>

      <!-- KOMPAKT AI SAKİN ROTA BANNER -->
      <div class="mx-3 mb-2 p-2.5 rounded-2xl bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-100 flex items-start gap-2">
        <div class="w-6 h-6 rounded-lg bg-blue-600 text-white flex items-center justify-center text-[10px] font-extrabold shrink-0 mt-0.5">
          AI
        </div>
        <div class="text-[11px] leading-snug text-slate-700" id="ai-recommendation">
          <strong class="text-blue-900 block">RabiCit AI Rota Analizi</strong>
          Çevrenizdeki en sakin tarihi nokta hesaplanıyor...
        </div>
      </div>

      <!-- MOBİL ALT NAVİGASYON BARI (TAB BAR) -->
      <nav class="bg-white border-t border-slate-100 px-6 py-2 flex items-center justify-between text-[10px] font-semibold text-slate-400 shrink-0">
        <button onclick="setActiveTab(this)" class="tab-btn flex flex-col items-center gap-0.5 text-blue-600 cursor-pointer">
          <span class="text-base">🗺️</span>
          <span>Radar</span>
        </button>
        <button onclick="setActiveTab(this); toggleWalkSimulation();" class="tab-btn flex flex-col items-center gap-0.5 hover:text-slate-700 cursor-pointer">
          <span class="text-base">🚶</span>
          <span>Yürüyüş</span>
        </button>
        <button onclick="setActiveTab(this); setFilter('calm', document.querySelectorAll('.filter-btn')[1]);" class="tab-btn flex flex-col items-center gap-0.5 hover:text-slate-700 cursor-pointer">
          <span class="text-base">✨</span>
          <span>Sakin Rotalar</span>
        </button>
        <button onclick="setActiveTab(this); map.setView([39.9410, 32.8615], 14);" class="tab-btn flex flex-col items-center gap-0.5 hover:text-slate-700 cursor-pointer">
          <span class="text-base">🏛️</span>
          <span>Altındağ</span>
        </button>
      </nav>
    </section>

  </div>

  <!-- Leaflet Harita JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. ALTINDAĞ TARİHSEL MEKANLAR VERİTABANI
    const altindagPlaces = [
      { id: 1, name: "Kurtuluş Savaşı Müzesi (I. TBMM)", category: "museum", lat: 39.9419, lng: 32.8544, crowd: 62, desc: "23 Nisan 1920'de açılan ilk Türkiye Büyük Millet Meclisi binası." },
      { id: 2, name: "Cumhuriyet Müzesi (II. TBMM)", category: "museum", lat: 39.9427, lng: 32.8535, crowd: 34, desc: "1924-1960 yılları arasında kullanılan tarihi meclis binası." },
      { id: 3, name: "Suluhan (Hasanpaşa Hanı)", category: "landmark", lat: 39.9394, lng: 32.8572, crowd: 45, desc: "16. yüzyıl Osmanlı döneminden kalma tarihi iki avlulu şehir hanı." },
      { id: 4, name: "Hacı Bayram-ı Veli Camii ve Türbesi", category: "landmark", lat: 39.9442, lng: 32.8579, crowd: 78, desc: "15. yüzyıldan kalma tarihi cami ve Ankara'nın manevi merkezi." },
      { id: 5, name: "Augustus Tapınağı", category: "landmark", lat: 39.9445, lng: 32.8583, crowd: 29, desc: "Roma İmparatoru Augustus adına inşa edilen antik tapınak kalıntıları." },
      { id: 6, name: "Roma Hamamı Açık Hava Müzesi", category: "museum", lat: 39.9488, lng: 32.8594, crowd: 21, desc: "3. yüzyıl Roma İmparatoru Caracalla dönemi antik hamam kalıntıları." },
      { id: 7, name: "Anadolu Medeniyetleri Müzesi", category: "museum", lat: 39.9383, lng: 32.8619, crowd: 54, desc: "Paleolitik çağdan Osmanlı'ya uzanan dünya çapında arkeoloji müzesi." },
      { id: 8, name: "Rahmi M. Koç Müzesi (Çengelhan)", category: "museum", lat: 39.9377, lng: 32.8633, crowd: 26, desc: "Tarihi kervansaray içerisinde sanayi, denizcilik ve ulaşım müzesi." },
      { id: 9, name: "Erimtan Arkeoloji ve Sanat Müzesi", category: "museum", lat: 39.9386, lng: 32.8636, crowd: 31, desc: "Kale meydanında yer alan Roma ve antik dönem koleksiyon müzesi." },
      { id: 10, name: "Ankara Kalesi & İç Kale", category: "landmark", lat: 39.9412, lng: 32.8644, crowd: 84, desc: "MÖ 2. yüzyıla uzanan tarihi surlar ve panoramik Ankara seyir terası." },
      { id: 11, name: "Arslanhane Camii (Ahi Şerafettin)", category: "landmark", lat: 39.9367, lng: 32.8653, crowd: 18, desc: "13. yüzyıl Anadolu Selçuklu ahşap direkli mimarisinin eşsiz örneği." },
      { id: 12, name: "Hamamönü Tarihi Konakları", category: "landmark", lat: 39.9333, lng: 32.8639, crowd: 73, desc: "Restore edilmiş 19. yüzyıl sivil Osmanlı mimarisi ve kültür sokakları." },
      { id: 13, name: "Tacettin Dergâhı", category: "landmark", lat: 39.9319, lng: 32.8669, crowd: 24, desc: "Mehmet Akif Ersoy'un İstiklal Marşı'nı kaleme aldığı tarihi mekân." },
      { id: 14, name: "Ulucanlar Cezaevi Müzesi", category: "museum", lat: 39.9389, lng: 32.8758, crowd: 42, desc: "1925'te inşa edilen ve müzeye dönüştürülen tarihi cezaevi." }
    ];

    // 2. ALTINDAĞ YÜRÜYÜŞ SİMÜLASYONU ROTASI (Ulus -> Hacı Bayram -> Kale -> Hamamönü)
    const walkRoute = [
      { lat: 39.9425, lng: 32.8542, label: "Adım 1/8: Ulus Meydanı & I. TBMM Önü" },
      { lat: 39.9438, lng: 32.8568, label: "Adım 2/8: Hacı Bayram Veli Bulvarı" },
      { lat: 39.9441, lng: 32.8585, label: "Adım 3/8: Augustus Tapınağı Çevresi" },
      { lat: 39.9415, lng: 32.8598, label: "Adım 4/8: Anafartalar Caddesi Yokuşu" },
      { lat: 39.9392, lng: 32.8622, label: "Adım 5/8: Kale Meydanı & Müzeler Bölgesi" },
      { lat: 39.9404, lng: 32.8640, label: "Adım 6/8: Ankara Kalesi Giriş Kapısı" },
      { lat: 39.9368, lng: 32.8648, label: "Adım 7/8: Arslanhane & Samanpazarı" },
      { lat: 39.9335, lng: 32.8642, label: "Adım 8/8: Hamamönü Tarihi Meydanı" }
    ];

    // 3. DURUM DEĞİŞKENLERİ
    let currentLat = walkRoute[0].lat;
    let currentLng = walkRoute[0].lng;
    let currentFilter = 'all';
    let simInterval = null;
    let simStepIndex = 0;
    let gpsWatchId = null;
    let walkedPathCoords = [[currentLat, currentLng]];

    // 4. HARİTAYI BAŞLAT (Altındağ Merkezli)
    const map = L.map('map', { zoomControl: true }).setView([39.9410, 32.8615], 14);

    // Sokak ve Uydu Harita Katmanları
    const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap katkıda bulunanlar'
    }).addTo(map);

    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: '&copy; Esri & Altındağ Uydu Görüntüsü'
    });

    L.control.layers(
      { "🗺️ Altındağ Sokak Haritası": streetLayer, "🛰️ Altındağ Uydu Görünümü": satelliteLayer },
      null,
      { position: 'bottomleft' }
    ).addTo(map);

    // Altındağ Tarihi Merkez & İlçe Odak Sınırı Poligonu
    const altindagBoundaryCoords = [
      [39.9560, 32.8480],
      [39.9585, 32.8660],
      [39.9520, 32.8850],
      [39.9360, 32.8860],
      [39.9280, 32.8710],
      [39.9305, 32.8520],
      [39.9415, 32.8465]
    ];

    const altindagPolygon = L.polygon(altindagBoundaryCoords, {
      color: '#1d4ed8',
      weight: 2.5,
      opacity: 0.65,
      fillColor: '#3b82f6',
      fillOpacity: 0.04,
      dashArray: '8, 6'
    }).addTo(map).bindTooltip("Altındağ Tarihi & Kültürel Bölge Sınırı", { sticky: true });

    // Kullanıcı İkonu, 1 km Çemberi, Yürünen İz Çizgisi ve Mekan Katmanı
    const userIcon = L.divIcon({
      className: 'custom-pulse',
      html: `<div class="pulse-marker"><div class="pulse-ring"></div><div class="pulse-dot"></div></div>`,
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });

    const userMarker = L.marker([currentLat, currentLng], { icon: userIcon, zIndexOffset: 1000 })
      .addTo(map)
      .bindPopup("<b>Canlı Konumunuz</b><br>1 km çap taranıyor...");

    const radarCircle = L.circle([currentLat, currentLng], {
      radius: 1000, // 1 kilometre = 1000 metre
      color: '#2563eb',
      fillColor: '#3b82f6',
      fillOpacity: 0.10,
      weight: 2,
      dashArray: '6, 6'
    }).addTo(map);

    const walkedPolyline = L.polyline(walkedPathCoords, {
      color: '#2563eb',
      weight: 4,
      opacity: 0.75
    }).addTo(map);

    const placesLayer = L.layerGroup().addTo(map);

    // 5. HAVERSINE MESAFE FORMÜLÜ (Metre cinsinden)
    function calculateDistance(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const toRad = (deg) => (deg * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    // 6. YOĞUNLUK RENK VE ETİKET YARDIMCISI
    function getCrowdStyle(score) {
      if (score < 40) {
        return { label: `Sakin (%${score})`, badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-200', pinColor: '#10b981' };
      }
      if (score < 70) {
        return { label: `Orta (%${score})`, badgeClass: 'bg-amber-100 text-amber-800 border-amber-200', pinColor: '#f59e0b' };
      }
      return { label: `Kalabalık (%${score})`, badgeClass: 'bg-rose-100 text-rose-800 border-rose-200', pinColor: '#e11d48' };
    }

    // 7. HARİTA VE LİSTEYİ GÜNCELLEME FONKSİYONU
    function updateRadar(lat, lng, titleText, recordPath = false) {
      currentLat = lat;
      currentLng = lng;
      const pos = [lat, lng];

      // Konum işaretçisi ve 1 km radar çemberini taşı
      userMarker.setLatLng(pos);
      radarCircle.setLatLng(pos);
      map.panTo(pos, { animate: true, duration: 0.6 });

      if (recordPath) {
        walkedPathCoords.push(pos);
        walkedPolyline.setLatLngs(walkedPathCoords);
      }

      // Üst durum kartını güncelle
      document.getElementById('status-title').innerText = titleText;
      document.getElementById('status-coords').innerText = `Enlem: ${lat.toFixed(5)} • Boylam: ${lng.toFixed(5)} • Radar: 1.0 km`;

      // 1 km (1000m) yakınındaki mekanları hesapla ve filtrele
      let nearby = altindagPlaces
        .map(place => ({
          ...place,
          distance: calculateDistance(lat, lng, place.lat, place.lng)
        }))
        .filter(place => place.distance <= 1000)
        .sort((a, b) => a.distance - b.distance);

      // Seçili kategori/yoğunluk filtresini uygula
      if (currentFilter === 'calm') {
        nearby = nearby.filter(p => p.crowd < 40);
      } else if (currentFilter === 'museum') {
        nearby = nearby.filter(p => p.category === 'museum');
      }

      // Harita pinlerini ve sağ listeyi temizle
      placesLayer.clearLayers();
      const listContainer = document.getElementById('places-list');
      document.getElementById('nearby-count').innerText = nearby.length;

      if (nearby.length === 0) {
        listContainer.innerHTML = `
          <div class="text-center py-8 px-4 bg-slate-50 rounded-xl border border-dashed border-slate-300">
            <p class="text-sm font-semibold text-slate-700 mb-1">1 km yakınınızda mekan bulunamadı</p>
            <p class="text-xs text-slate-500">Altındağ içindeki mekanları görmek için <b>Yürüyüş Simülasyonunu Başlat</b> butonuna tıklayın veya haritada Altındağ üzerine dokunun.</p>
          </div>
        `;
        document.getElementById('ai-recommendation').innerHTML = `
          <strong class="text-blue-900 block mb-0.5">RabiCit AI Rota Analizi</strong>
          Şu anki konumunuzun 1 km yakınında kayıtlı Altındağ tarihi noktası yer almıyor.
        `;
        return;
      }

      listContainer.innerHTML = '';

      nearby.forEach(place => {
        const style = getCrowdStyle(place.crowd);
        const walkMinutes = Math.max(1, Math.round(place.distance / 75));

        // Haritaya özel renkli pin ekle
        const pinIcon = L.divIcon({
          className: 'historical-pin',
          html: `<div style="width:16px;height:16px;background:${style.pinColor};border:3px solid #ffffff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,0.35);"></div>`,
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        });

        const marker = L.marker([place.lat, place.lng], { icon: pinIcon })
          .bindPopup(`
            <div style="font-family:Inter,sans-serif;min-width:170px;">
              <strong style="font-size:13px;color:#0f172a;">${place.name}</strong><br>
              <span style="font-size:11px;color:#2563eb;font-weight:600;">🚶 ${place.distance} m (~${walkMinutes} dk yürüyüş)</span><br>
              <span style="font-size:11px;color:#475569;">Yoğunluk: <b>${style.label}</b></span>
            </div>
          `);
        placesLayer.addLayer(marker);

        // Sağ panele mekan kartı oluştur
        const card = document.createElement('div');
        card.className = "p-3.5 rounded-xl border border-slate-200 bg-white hover:border-blue-400 hover:shadow-md transition cursor-pointer";
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 mb-1.5">
            <h3 class="text-sm font-bold text-slate-900 leading-snug">${place.name}</h3>
            <span class="px-2 py-0.5 rounded-full text-[11px] font-bold border shrink-0 ${style.badgeClass}">
              ${style.label}
            </span>
          </div>
          <div class="flex items-center gap-2 text-xs font-semibold text-blue-600 mb-1.5">
            <span>🚶 ${place.distance} metre</span>
            <span class="text-slate-300">•</span>
            <span>~${walkMinutes} dk yürüyüş</span>
          </div>
          <p class="text-xs text-slate-500 leading-relaxed">${place.desc}</p>
        `;
        card.onclick = () => {
          map.setView([place.lat, place.lng], 17, { animate: true });
          marker.openPopup();
        };
        listContainer.appendChild(card);
      });

      // AI Sakin Rota Önerisini Güncelle
      const calmest = [...nearby].sort((a, b) => a.crowd - b.crowd)[0];
      const busiest = [...nearby].sort((a, b) => b.crowd - a.crowd)[0];
      const aiEl = document.getElementById('ai-recommendation');

      if (calmest && busiest && busiest.crowd >= 70 && calmest.id !== busiest.id) {
        aiEl.innerHTML = `
          <strong class="text-blue-900 block mb-0.5">RabiCit AI Sakin Rota Önerisi</strong>
          Yakınınızdaki <b>${busiest.name}</b> şu an yoğun (%${busiest.crowd}). Bunun yerine yalnızca <b>${calmest.distance} m</b> mesafedeki <b>${calmest.name}</b> (%${calmest.crowd} sakin) noktasını tercih edebilirsiniz.
        `;
      } else if (calmest) {
        aiEl.innerHTML = `
          <strong class="text-blue-900 block mb-0.5">RabiCit AI Rota Analizi</strong>
          1 km çevrenizdeki en sakin durak: <b>${calmest.name}</b> (${calmest.distance} m uzaklıkta, %${calmest.crowd} yoğunluk).
        `;
      }
    }

    // 8. FİLTRE DEĞİŞTİRME
    function setFilter(filterType, btnEl) {
      currentFilter = filterType;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.className = "filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition cursor-pointer";
      });
      btnEl.className = "filter-btn active px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white transition cursor-pointer";
      updateRadar(currentLat, currentLng, document.getElementById('status-title').innerText, false);
    }

    // 9. YÜRÜYÜŞ SİMÜLASYONU BAŞLAT / DURDUR
    function toggleWalkSimulation() {
      const btnSim = document.getElementById('btn-sim');
      const simText = document.getElementById('sim-text');
      const simIcon = document.getElementById('sim-icon');
      const progressCard = document.getElementById('sim-progress-card');

      // Eğer çalışıyorsa durdur
      if (simInterval) {
        clearInterval(simInterval);
        simInterval = null;
        simText.innerText = "Yürüyüşü Başlat";
        simIcon.innerText = "🚶";
        btnSim.classList.remove('bg-rose-600', 'hover:bg-rose-700');
        btnSim.classList.add('bg-blue-600', 'hover:bg-blue-700');
        progressCard.classList.add('hidden');
        return;
      }

      // Gerçek GPS takibi varsa durdur
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
      }

      // Simülasyonu başlat
      simStepIndex = 0;
      walkedPathCoords = [[walkRoute[0].lat, walkRoute[0].lng]];
      walkedPolyline.setLatLngs(walkedPathCoords);

      simText.innerText = "Durdur";
      simIcon.innerText = "⏸️";
      btnSim.classList.remove('bg-blue-600', 'hover:bg-blue-700');
      btnSim.classList.add('bg-rose-600', 'hover:bg-rose-700');
      progressCard.classList.remove('hidden');

      const step = walkRoute[0];
      document.getElementById('sim-step-label').innerText = step.label;
      updateRadar(step.lat, step.lng, step.label, true);

      simInterval = setInterval(() => {
        simStepIndex = (simStepIndex + 1) % walkRoute.length;
        if (simStepIndex === 0) {
          walkedPathCoords = [];
        }
        const nextStep = walkRoute[simStepIndex];
        document.getElementById('sim-step-label').innerText = nextStep.label;
        updateRadar(nextStep.lat, nextStep.lng, nextStep.label, true);
      }, 2500);
    }

    // Mobil Alt Sekme Aktiflik Kontrolü
    function setActiveTab(el) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('text-blue-600');
        btn.classList.add('text-slate-400');
      });
      el.classList.remove('text-slate-400');
      el.classList.add('text-blue-600');
    }

    // 10. GERÇEK CİHAZ GPS TAKİBİ
    function startRealGPS() {
      if (simInterval) {
        toggleWalkSimulation();
      }
      if (!("geolocation" in navigator)) {
        document.getElementById('status-title').innerText = "Tarayıcınız konum servisini desteklemiyor.";
        return;
      }

      document.getElementById('status-title').innerText = "Gerçek GPS konumu alınıyor...";
      walkedPathCoords = [];
      walkedPolyline.setLatLngs([]);

      gpsWatchId = navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          updateRadar(lat, lng, "Canlı Cihaz GPS Konumu Aktif", true);
        },
        (err) => {
          document.getElementById('status-title').innerText = "GPS İzni Alınamadı (Haritaya tıklayarak test edebilirsiniz)";
        },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
      );
    }

    // 11. HARİTAYA TIKLAYARAK MANUEL KONUM SEÇME
    map.on('click', (e) => {
      if (simInterval) {
        toggleWalkSimulation();
      }
      walkedPathCoords = [[e.latlng.lat, e.latlng.lng]];
      walkedPolyline.setLatLngs(walkedPathCoords);
      updateRadar(e.latlng.lat, e.latlng.lng, "Manuel Seçilen Altındağ Konumu", false);
    });

    // Sayfa yüklendiğinde harita boyutunu doğrula ve ilk konumu çiz
    window.onload = function () {
      setTimeout(() => {
        map.invalidateSize();
        updateRadar(currentLat, currentLng, "Altındağ Başlangıç Noktası (Ulus Meydanı)", false);
      }, 150);
    };
  </script>
</body>
</html>
